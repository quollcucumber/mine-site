name = "mine-site"
main = "cf/worker.mjs"
compatibility_date = "2026-04-08"
workers_dev = true

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
POOL_HOST = "pool.hashvault.pro"
POOL_PORT = "3333"
POOL_FIXED_DIFF = "20000"

[[durable_objects.bindings]]
name = "STORE"
class_name = "AppStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppStore"]
